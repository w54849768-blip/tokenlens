<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TokenLens · AI 用量仪表盘</title>
<link rel="icon" href="/icon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icon-256.png">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <img src="/icon-64.png" width="28" height="28" alt="TokenLens">
      </div>
      <div class="brand-text">
        <strong>TokenLens</strong>
        <span>本地 AI 用量仪表盘</span>
      </div>
    </div>

    <nav class="nav" id="nav">
      <a data-page="overview" class="active">
        <svg viewBox="0 0 24 24" class="ico"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z"/></svg>
        <span>总览</span>
      </a>
      <a data-page="products">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 2 2 7l10 5 10-5-10-5Zm-10 8.5 10 5 10-5v3l-10 5-10-5v-3Zm0 5 10 5 10-5v3l-10 5-10-5v-3Z"/></svg>
        <span>各产品用量</span>
      </a>
      <a data-page="requests">
        <svg viewBox="0 0 24 24" class="ico"><path d="M4 5h16v2H4V5Zm0 6h16v2H4v-2Zm0 6h10v2H4v-2Z"/></svg>
        <span>请求日志</span>
      </a>
      <a data-page="chats">
        <svg viewBox="0 0 24 24" class="ico"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>
        <span>聊天记录</span>
      </a>
      <a data-page="balances">
        <svg viewBox="0 0 24 24" class="ico"><path d="M3 7h18v3H3V7Zm0 5h18v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-7Zm14 3h3v3h-3v-3Z"/></svg>
        <span>账号余额</span>
      </a>
      <a data-page="providers">
        <svg viewBox="0 0 24 24" class="ico"><path d="M4 4h7v7H4V4Zm9 0h7v7h-7V4ZM4 13h7v7H4v-7Zm9 0h7v7h-7v-7Z"/></svg>
        <span>供应商</span>
      </a>
      <a data-page="settings">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 4a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7.2 7.2 0 0 0-2-1.2L16.2 3h-4l-.4 2.6a7.2 7.2 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7.2 7.2 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7.2 7.2 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.06-.4.1-.8.1-1.2Z"/></svg>
        <span>设置</span>
      </a>
    </nav>

    <div class="side-foot">
      <div class="side-card" id="source-status"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="page-head">
        <h1 id="page-title">总览</h1>
        <p id="page-sub">加载中…</p>
      </div>
      <div class="topbar-actions">
        <div class="seg" id="range-pills">
          <button data-range="1">24h</button>
          <button data-range="7">7天</button>
          <button data-range="14" class="active">14天</button>
          <button data-range="30">30天</button>
          <button data-range="all">全部</button>
        </div>
        <button class="btn btn-ghost" id="btn-refresh" title="重新读取数据">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg>
          <span>刷新</span>
        </button>
      </div>
    </header>

    <section class="view" id="view"></section>
  </main>
</div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h3 id="drawer-title">请求详情</h3>
    <button class="icon-btn" id="drawer-close" aria-label="关闭">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="drawer-mask" id="drawer-mask"></div>

<div class="chart-tip" id="chart-tip"></div>
<div class="toast" id="toast"></div>

<script src="/js/charts.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
